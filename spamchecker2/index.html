<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Validator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Email/SMS Link Validator</h1>
        <form id="validatorForm">
            <textarea id="content" name="content" placeholder="Paste email or SMS here..." rows="10"
                required></textarea>
            <button type="submit">Validate Links</button>
        </form>
        <div id="results"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
